<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Evolução Financeira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<header class="top"><div class="topin">
  <div class="brandmini"><div class="ev">EV</div><div><b>Evolução Financeira</b><small>inova com valor</small></div></div>
</div></header>

<main>
  <div id="status" class="status"><b>Carregando…</b>Abrindo o seu painel.</div>
  <section id="v-emp" hidden>
    <div class="emphead">
      <div class="eid"><div class="av" id="eAv"></div><div><h1 id="eNome"></h1><p id="eMeta"></p></div></div>
    </div>
    <div class="toolbar" id="tbar" hidden>
      <div class="seg" id="mode"><button data-m="mensal" class="on">Mensal</button><button data-m="trimestral">Trimestral</button><button data-m="anual">Anual</button></div>
      <label>Mês <select id="month"></select></label>
      <label>Versão <select id="ver"></select></label>
      <button class="btn sm" id="bPdf">Baixar PDF</button>
    </div>
    <div class="empty" id="empty" hidden></div>
    <div id="report"></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script src="/report.js"></script>
<script src="/cliente.js"></script>
</body>
</html>
